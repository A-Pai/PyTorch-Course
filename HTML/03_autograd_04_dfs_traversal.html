<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反向传播：拓扑序与深度优先遍历</title>
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;
--purple:#7b5cc4;--purple-bg:#F0EBFA;--amber:#b8860b;--amber-bg:#FBF3DE;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:6px;margin:0 3px;}
.t-blue{background:var(--blue-bg);color:var(--blue);}
.t-orange{background:var(--orange-bg);color:var(--orange);}
.t-green{background:var(--green-bg);color:var(--green);}
.t-red{background:var(--red-bg);color:var(--red);}
.t-purple{background:var(--purple-bg);color:var(--purple);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>反向传播：拓扑序与深度优先遍历</h1>
<p class="src">对应教程：四、遍历机制 / 4.3 方向  +  4.4 栈  +  4.5 完整示例</p>
<div class="figure">
<svg viewBox="10.0 -0.7 1250.0 723.7" role="img" aria-label="反向传播：拓扑序与深度优先遍历">
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7b5cc4" stroke-width="1.8"/></marker>
</defs>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1a1d24" text-anchor="start">反向传播 = 按拓扑序深度优先遍历计算图</text>
<text x="40" y="92" font-size="22" fill="#5a6270" text-anchor="start">核心要求：任何节点必须等它的“下游依赖”都算完，才能轮到自己</text>
<text x="40" y="145" font-size="23" font-weight="600" fill="#2f6fb0" text-anchor="start" dominant-baseline="central">前向 DAG：y = (x + w) × b</text>
<rect x="80.0" y="180" width="140" height="66" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="150" y="213.0" font-size="24" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">x</text>
<rect x="80.0" y="280" width="140" height="66" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="150" y="313.0" font-size="24" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">w</text>
<rect x="360.0" y="230" width="160" height="76" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="440" y="253.0" font-size="23" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">s = x + w</text>
<text x="440" y="283.0" font-size="17" fill="#39618c" text-anchor="middle" dominant-baseline="central">AddBackward0</text>
<rect x="665.0" y="230" width="150" height="76" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="740" y="253.0" font-size="23" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">y = s × b</text>
<text x="740" y="283.0" font-size="17" fill="#39618c" text-anchor="middle" dominant-baseline="central">MulBackward0</text>
<rect x="370.0" y="355" width="140" height="62" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="440" y="386.0" font-size="24" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">b</text>
<path d="M220 213L360 250" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<path d="M220 313L360 285" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<path d="M520 268L665 268" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<path d="M510 355L690 300" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<text x="40" y="470" font-size="23" font-weight="600" fill="#7b5cc4" text-anchor="start" dominant-baseline="central">反向访问顺序：从 y 出发，沿 next_functions 递归（栈 / DFS）</text>
<rect x="30.0" y="510" width="280" height="108" rx="14" fill="#F0EBFA" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="170" y="533.3333333333334" font-size="18" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">第 1 步</text>
<text x="170" y="564.0" font-size="21" font-weight="600" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">MulBackward0</text>
<text x="170" y="594.6666666666667" font-size="16" fill="#5a4a8a" text-anchor="middle" dominant-baseline="central">算 ∂y/∂s、∂y/∂b</text>
<rect x="340.0" y="510" width="280" height="108" rx="14" fill="#F0EBFA" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="480" y="533.3333333333334" font-size="18" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">第 2 步</text>
<text x="480" y="564.0" font-size="21" font-weight="600" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">AddBackward0</text>
<text x="480" y="594.6666666666667" font-size="16" fill="#5a4a8a" text-anchor="middle" dominant-baseline="central">算 ∂s/∂w = 1</text>
<rect x="650.0" y="510" width="280" height="108" rx="14" fill="#F0EBFA" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="790" y="533.3333333333334" font-size="18" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">第 3 步</text>
<text x="790" y="564.0" font-size="21" font-weight="600" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">AccumulateGrad_b</text>
<text x="790" y="594.6666666666667" font-size="16" fill="#5a4a8a" text-anchor="middle" dominant-baseline="central">把 ∂y/∂b 写入 b.grad</text>
<rect x="960.0" y="510" width="280" height="108" rx="14" fill="#F0EBFA" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="1100" y="533.3333333333334" font-size="18" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">第 4 步</text>
<text x="1100" y="564.0" font-size="21" font-weight="600" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">AccumulateGrad_w/x</text>
<text x="1100" y="594.6666666666667" font-size="16" fill="#5a4a8a" text-anchor="middle" dominant-baseline="central">链式相乘后写入 .grad</text>
<path d="M310 564L340 564" stroke="#7b5cc4" stroke-width="2.6" fill="none" marker-end="url(#arrP)"/>
<path d="M620 564L650 564" stroke="#7b5cc4" stroke-width="2.6" fill="none" marker-end="url(#arrP)"/>
<path d="M930 564L960 564" stroke="#7b5cc4" stroke-width="2.6" fill="none" marker-end="url(#arrP)"/>
<rect x="80.0" y="645" width="1120" height="58" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="640" y="674.0" font-size="22" font-weight="600" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">关键：不是“必须 DFS”，而是“必须满足拓扑序”——BFS 配合拓扑排序同样正确</text>
</svg>
<ul class="points">
    <li>遍历方向是<strong>逆数据流</strong>：从输出 y 出发，沿 next_functions 回到参数叶子。</li>
    <li>真正的要求是<strong>拓扑序</strong>——依赖先于使用者计算；DFS 天然满足，BFS 配合拓扑排序也可行。</li>
    <li>递归遍历的终点是各叶子的 AccumulateGrad，梯度在此写入 <code>.grad</code>。</li>
</ul>
</div>
</div>
</body>
</html>
