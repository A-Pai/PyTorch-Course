<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态计算图与梯度流：前向建图，反向回溯</title>
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:6px;margin:0 3px;}
.t-blue{background:var(--blue-bg);color:var(--blue);}
.t-orange{background:var(--orange-bg);color:var(--orange);}
.t-green{background:var(--green-bg);color:var(--green);}
.t-red{background:var(--red-bg);color:var(--red);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>动态计算图与梯度流：前向建图，反向回溯</h1>
<p class="src">对应教程：三、自动微分 / 3.1 Autograd / 附录一</p>
<div class="figure">
<svg viewBox="20.0 29.6 1240.0 645.0" role="img" aria-label="动态计算图与梯度流">
    <text x="40" y="80" font-size="28" font-weight="600" fill="#2f6fb0">前向（蓝）：动态构建计算图，记录 grad_fn</text>

    <rect x="40" y="130" width="360" height="220" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.5"/>
    <text x="220" y="195" font-size="34" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">x（叶子）</text>
    <text x="220" y="250" font-size="24" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">requires_grad=True</text>
    <text x="220" y="305" font-size="24" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">grad_fn = None</text>

    <rect x="460" y="130" width="360" height="220" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.5"/>
    <text x="640" y="195" font-size="34" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">y = x²</text>
    <text x="640" y="250" font-size="24" fill="#39618c" text-anchor="middle" dominant-baseline="central">非叶子 · is_leaf=False</text>
    <text x="640" y="305" font-size="24" fill="#39618c" text-anchor="middle" dominant-baseline="central">grad_fn=&lt;PowBackward&gt;</text>

    <rect x="880" y="130" width="360" height="220" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.5"/>
    <text x="1060" y="195" font-size="34" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">z = y.sum()</text>
    <text x="1060" y="250" font-size="24" fill="#39618c" text-anchor="middle" dominant-baseline="central">非叶子 · is_leaf=False</text>
    <text x="1060" y="305" font-size="24" fill="#39618c" text-anchor="middle" dominant-baseline="central">grad_fn=&lt;SumBackward&gt;</text>

    <path d="M400 240 L460 240" stroke="#2f6fb0" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
    <path d="M820 240 L880 240" stroke="#2f6fb0" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
    <text x="430" y="215" font-size="20" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">pow</text>
    <text x="850" y="215" font-size="20" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">sum</text>

    <text x="40" y="440" font-size="28" font-weight="600" fill="#EE4C2C">反向（橙）：z.backward() 沿图回溯，链式法则计算并累积 .grad</text>
    <path d="M1060 350 L1060 555 L220 555 L220 350" stroke="#EE4C2C" stroke-width="2.5" fill="none" marker-end="url(#arrO)"/>
    <text x="640" y="538" font-size="26" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">∂z/∂y = 1　→　∂z/∂x = 2x，累加到 x.grad</text>
    <text x="220" y="640" font-size="22" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">只有叶子 x 持久保存 .grad</text>
    <text x="1060" y="640" font-size="22" fill="#5a6270" text-anchor="middle" dominant-baseline="central">中间节点的梯度默认用完即弃</text>
    <defs>
      <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
      <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
    </defs>
</svg>
<ul class="points">
    <li><span class="tag t-blue">grad_fn</span> 是"我由哪个运算产生"的记录，串起反向路径；叶子的 grad_fn 为 None。</li>
    <li><span class="tag t-orange">is_leaf</span> 决定谁能持久保存 .grad；输入样本不求导，但作为图节点被引用，仍须是 Tensor。</li>
    <li>图是<strong>动态</strong>的：每次前向重新构建，backward 后默认释放——这正是 PyTorch "动态图"的含义。</li>
  </ul>
</div>
</div>
</body>
</html>
