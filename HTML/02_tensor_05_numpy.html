<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NumPy ↔ Tensor：哪些共享内存，哪些拷贝</title>
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:6px;margin:0 3px;}
.t-blue{background:var(--blue-bg);color:var(--blue);}
.t-orange{background:var(--orange-bg);color:var(--orange);}
.t-green{background:var(--green-bg);color:var(--green);}
.t-red{background:var(--red-bg);color:var(--red);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>NumPy ↔ Tensor：哪些共享内存，哪些拷贝</h1>
<p class="src">对应教程：4.2 转换两种模式</p>
<div class="figure">
<svg viewBox="20.0 -0.7 1240.0 721.5" role="img" aria-label="NumPy 与 Tensor 内存关系">
    <text x="640" y="52" font-size="30" font-weight="600" fill="#1a1d24" text-anchor="middle">NumPy ↔ Tensor：哪些共享内存，哪些拷贝</text>

    <rect x="490" y="195" width="300" height="300" rx="14" fill="#f5f6f8" stroke="#8a919c" stroke-width="2"/>
    <text x="640" y="240" font-size="26" font-weight="600" fill="#5a6270" text-anchor="middle" dominant-baseline="central">同一块内存</text>
    <g fill="#fff" stroke="#8a919c" stroke-width="1.8">
      <rect x="520" y="290" width="76" height="76" rx="6"/><rect x="602" y="290" width="76" height="76" rx="6"/><rect x="684" y="290" width="76" height="76" rx="6"/>
    </g>
    <g font-size="36" fill="#5a6270" text-anchor="middle" dominant-baseline="central">
      <text x="558" y="328">1</text><text x="640" y="328">2</text><text x="722" y="328">3</text>
    </g>
    <text x="640" y="440" font-size="22" fill="#5a6270" text-anchor="middle" dominant-baseline="central">arr 与共享视图指向这里</text>

    <rect x="40" y="170" width="330" height="110" rx="12" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2"/>
    <text x="205" y="225" font-size="26" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">np_arr = np.array([1,2,3])</text>

    <rect x="40" y="450" width="350" height="150" rx="12" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2"/>
    <text x="215" y="500" font-size="26" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">from_numpy(np_arr)</text>
    <text x="215" y="550" font-size="24" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">t.numpy()</text>

    <path d="M370 225 L490 280" stroke="#1f9d6b" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
    <path d="M390 505 L490 390" stroke="#1f9d6b" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
    <text x="440" y="345" font-size="22" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">共享内存</text>

    <rect x="910" y="170" width="330" height="110" rx="12" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2"/>
    <text x="1075" y="225" font-size="26" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">torch.tensor(np_arr)</text>
    <rect x="910" y="450" width="330" height="150" rx="12" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2"/>
    <text x="1075" y="500" font-size="26" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">新内存块 [1,2,3]</text>
    <text x="1075" y="550" font-size="24" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">与 np_arr 互不影响</text>
    <path d="M1075 280 L1075 450" stroke="#EE4C2C" stroke-width="2.5" fill="none" marker-end="url(#arrO)"/>
    <text x="1140" y="365" font-size="22" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">拷贝</text>

    <line x1="40" y1="635" x2="1240" y2="635" stroke="#e2e6ec" stroke-width="1.5"/>
    <text x="640" y="685" font-size="24" fill="#333a45" text-anchor="middle" dominant-baseline="central">口诀：from_numpy / numpy() 共享内存，torch.tensor(...) 拷贝数据</text>
    <defs>
      <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
      <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
    </defs>
</svg>
<ul class="points">
    <li><span class="tag t-green">共享</span>：<code>torch.from_numpy(arr)</code> 与 <code>t.numpy()</code> —— 改一方，另一方跟着变。</li>
    <li><span class="tag t-orange">拷贝</span>：<code>torch.tensor(arr)</code> —— 数据独立，互不影响。</li>
  </ul>
</div>
</div>
</body>
</html>
