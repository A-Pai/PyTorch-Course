<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;
--purple:#7b5cc4;--purple-bg:#F0EBFA;--amber:#b8860b;--amber-bg:#FBF3DE;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>三套台账与便捷 API</h1>
<p class="src">对应教程：五、三套统一管理台账 + 八、依托台账实现的全套 API</p>
<div class="figure">
<svg viewBox="18.8 7.3 1221.2 608.2" role="img" aria-label="三套台账与便捷 API">
<defs>
<marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7b5cc4" stroke-width="1.8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b8860b" stroke-width="1.8"/></marker>
</defs>
<text x="40" y="46" font-size="28" font-weight="700" fill="#1a1d24" text-anchor="start" dominant-baseline="central">三套台账与便捷 API</text>
<text x="40" y="86" font-size="17" font-weight="400" fill="#5a6270" text-anchor="start" dominant-baseline="central">nn.Module 用三张有序字典统一管理所有对象；便捷方法本质都是遍历这些台账</text>
<text x="40" y="120" font-size="19" font-weight="700" fill="#1a1d24" text-anchor="start" dominant-baseline="central">三套统一台账（nn.Module.__init__ 自动创建）</text>
<rect x="40" y="145" width="380" height="150" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="230" y="180" font-size="22" font-weight="700" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">_parameters</text>
<text x="230" y="215" font-size="16" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">存：可训练权重 Parameter</text>
<text x="230" y="245" font-size="15" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">识别：Parameter 标识（自动）</text>
<text x="230" y="275" font-size="15" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">weight / bias 都在这里</text>
<rect x="440" y="145" width="380" height="150" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="630" y="180" font-size="22" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">_modules</text>
<text x="630" y="215" font-size="16" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">存：子模块 nn.Module</text>
<text x="630" y="245" font-size="15" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">识别：Module 子类标识（自动）</text>
<text x="630" y="275" font-size="15" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">Linear / Conv / 自定义子网络</text>
<rect x="840" y="145" width="380" height="150" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="1030" y="180" font-size="22" font-weight="700" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">_buffers</text>
<text x="1030" y="215" font-size="16" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">存：缓存张量（非参数）</text>
<text x="1030" y="245" font-size="15" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">识别：需手动 register_buffer</text>
<text x="1030" y="275" font-size="15" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">BN 的 running_mean / var</text>
<path d="M230 310 L1030 310" stroke="#b9c0ca" stroke-width="2" fill="none"/>
<path d="M640 308 L640 350" stroke="#EE4C2C" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
<text x="658" y="330" font-size="17" font-weight="400" fill="#5a6270" text-anchor="start" dominant-baseline="central">所有便捷 API 的本质：遍历这些台账</text>
<rect x="40" y="365" width="275" height="175" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="177" y="395" font-size="19" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">parameters()</text>
<text x="177" y="432" font-size="15" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">named_parameters()</text>
<text x="177" y="465" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">遍历 _parameters</text>
<text x="177" y="492" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">并递归所有子 _modules</text>
<text x="177" y="519" font-size="14" font-weight="400" fill="#5a6270" text-anchor="middle" dominant-baseline="central">→ 拿到全部可训练参数</text>
<rect x="340" y="365" width="275" height="175" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="477" y="395" font-size="19" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">.to(device)</text>
<text x="477" y="432" font-size="15" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">.cuda()</text>
<text x="477" y="465" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">遍历 _parameters</text>
<text x="477" y="492" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">+ _buffers 批量迁移</text>
<text x="477" y="519" font-size="14" font-weight="400" fill="#5a6270" text-anchor="middle" dominant-baseline="central">→ 整模型一键搬设备</text>
<rect x="640" y="365" width="275" height="175" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="777" y="395" font-size="19" font-weight="700" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">train() / eval()</text>
<text x="777" y="432" font-size="15" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">模式切换</text>
<text x="777" y="465" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">递归全部 _modules</text>
<text x="777" y="492" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">改 training 标记</text>
<text x="777" y="519" font-size="14" font-weight="400" fill="#5a6270" text-anchor="middle" dominant-baseline="central">→ 控制 Dropout/BN 行为</text>
<rect x="940" y="365" width="275" height="175" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="1077" y="395" font-size="19" font-weight="700" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">state_dict()</text>
<text x="1077" y="432" font-size="15" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">持久化</text>
<text x="1077" y="465" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">收集 _parameters</text>
<text x="1077" y="492" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">+ _buffers 的张量</text>
<text x="1077" y="519" font-size="14" font-weight="400" fill="#5a6270" text-anchor="middle" dominant-baseline="central">→ 有序字典，用于保存</text>
<text x="40" y="585" font-size="16" font-weight="400" fill="#5a6270" text-anchor="start" dominant-baseline="central">注意：普通 Tensor 直接赋值不会进入任何台账；Buffer 必须 register_buffer 手动登记。</text>
</svg>
<ul class="points">
    <li><strong>_parameters</strong> 自动收 nn.Parameter（可训练）；<strong>_modules</strong> 自动收子 Module；<strong>_buffers</strong> 需 register_buffer 手动登记。</li>
    <li>parameters() / to(device) / train、eval() / state_dict() 全部通过遍历这三张台账实现。</li>
    <li>Buffer 不参与梯度但会进 state_dict，专门保存 BN 的 running_mean 等统计缓存。</li>
</ul>
</div>
</div>
</body>
</html>
