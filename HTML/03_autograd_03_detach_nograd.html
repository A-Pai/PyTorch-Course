<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>切断 autograd：detach 与 no_grad</title>
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;
--purple:#7b5cc4;--purple-bg:#F0EBFA;--amber:#b8860b;--amber-bg:#FBF3DE;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:6px;margin:0 3px;}
.t-blue{background:var(--blue-bg);color:var(--blue);}
.t-orange{background:var(--orange-bg);color:var(--orange);}
.t-green{background:var(--green-bg);color:var(--green);}
.t-red{background:var(--red-bg);color:var(--red);}
.t-purple{background:var(--purple-bg);color:var(--purple);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>切断 autograd：detach 与 no_grad</h1>
<p class="src">对应教程：三、操控 autograd / 3.3 切断追踪的两种方式</p>
<div class="figure">
<svg viewBox="20.0 -0.7 1160.0 700.7" role="img" aria-label="切断 autograd：detach 与 no_grad">
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7b5cc4" stroke-width="1.8"/></marker>
</defs>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1a1d24" text-anchor="start">切断 autograd 的两种方式：detach 与 no_grad</text>
<text x="40" y="92" font-size="22" fill="#5a6270" text-anchor="start">箭头方向 = 梯度传播方向（从输出 → 输入）</text>
<text x="40" y="140" font-size="24" font-weight="600" fill="#EE4C2C" text-anchor="start" dominant-baseline="central">.detach()：单张量粒度，切断一条链</text>
<rect x="55.0" y="175" width="190" height="84" rx="14" fill="#F1EFE8" stroke="#888780" stroke-width="2.2"/>
<text x="150" y="200.0" font-size="22" font-weight="600" fill="#1a1d24" text-anchor="middle" dominant-baseline="central">x（上游叶子）</text>
<text x="150" y="234.0" font-size="15" fill="#5a6270" text-anchor="middle" dominant-baseline="central">requires_grad=True</text>
<rect x="380.0" y="175" width="240" height="84" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="500" y="200.0" font-size="24" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">h_detached</text>
<text x="500" y="234.0" font-size="16" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">requires_grad=False</text>
<rect x="790.0" y="175" width="220" height="84" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="900" y="200.0" font-size="24" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">out</text>
<text x="900" y="234.0" font-size="16" fill="#39618c" text-anchor="middle" dominant-baseline="central">由 h_detached + 2 得到</text>
<path d="M790 217L620 217" stroke="#1f9d6b" stroke-width="2.4" fill="none" marker-end="url(#arrG)"/>
<text x="312" y="214" font-size="34" font-weight="600" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">✕</text>
<text x="312" y="250" font-size="18" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">切断</text>
<text x="60" y="300" font-size="18" fill="#8a4a38" text-anchor="start" dominant-baseline="central">h_detached 与 h 共享数据，但不在原图中：梯度不会流到它，也不会回到 x</text>
<text x="60" y="335" font-size="19" font-weight="600" fill="#d23f3f" text-anchor="start" dominant-baseline="central">→ x.grad = None</text>
<text x="40" y="385" font-size="24" font-weight="600" fill="#7b5cc4" text-anchor="start" dominant-baseline="central">no_grad()：代码块粒度，整段不建图</text>
<rect x="120" y="410" width="1040" height="165" rx="14" fill="#F0EBFA" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="640" y="445" font-size="22" font-weight="600" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">with torch.no_grad():</text>
<rect x="460.0" y="470" width="360" height="70" rx="14" fill="#fff" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="640" y="505.0" font-size="20" font-weight="600" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">out = x * 3 + 2   →   无 grad_fn</text>
<text x="640" y="552" font-size="18" fill="#5a4a8a" text-anchor="middle" dominant-baseline="central">区域内不生成任何图节点</text>
<rect x="180" y="600" width="920" height="80" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="640" y="628" font-size="22" font-weight="600" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">共同点：两者都切断梯度、不产生新的图节点</text>
<text x="640" y="660" font-size="17" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">区别：detach 切“单个张量的一条链”，no_grad 关“整个代码块的记录系统”</text>
</svg>
<ul class="points">
    <li><span class="tag t-orange">detach</span> 产出的张量不在原计算图中，梯度不会流到它，更不会回到上游。</li>
    <li><span class="tag t-purple">no_grad</span> 区域内不建任何图节点，但参数数值仍可被优化器在区外更新。</li>
    <li>两者都切断梯度、不产生新节点；区别在作用粒度——单张量 vs 整个代码块。</li>
</ul>
</div>
</div>
</body>
</html>
