<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广播机制：小形状如何"拉伸"匹配大形状</title>
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:6px;margin:0 3px;}
.t-blue{background:var(--blue-bg);color:var(--blue);}
.t-orange{background:var(--orange-bg);color:var(--orange);}
.t-green{background:var(--green-bg);color:var(--green);}
.t-red{background:var(--red-bg);color:var(--red);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>广播机制：小形状如何"拉伸"匹配大形状</h1>
<p class="src">对应教程：2.4 基础四则运算 + 广播机制</p>
<div class="figure">
<svg viewBox="40.0 -0.7 1200.0 725.3" role="img" aria-label="广播机制示意图">
    <text x="640" y="52" font-size="30" font-weight="600" fill="#1a1d24" text-anchor="middle">广播机制：小形状如何"拉伸"匹配大形状</text>
    <text x="640" y="92" font-size="22" fill="#5a6270" text-anchor="middle">示例：a (3,4) + b (4,) → 结果 (3,4)</text>

    <text x="209" y="140" font-size="26" font-weight="600" fill="#2f6fb0" text-anchor="middle">a · shape (3,4)</text>
    <g fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2">
      <rect x="60" y="160" width="70" height="70" rx="6"/><rect x="136" y="160" width="70" height="70" rx="6"/><rect x="212" y="160" width="70" height="70" rx="6"/><rect x="288" y="160" width="70" height="70" rx="6"/>
      <rect x="60" y="236" width="70" height="70" rx="6"/><rect x="136" y="236" width="70" height="70" rx="6"/><rect x="212" y="236" width="70" height="70" rx="6"/><rect x="288" y="236" width="70" height="70" rx="6"/>
      <rect x="60" y="312" width="70" height="70" rx="6"/><rect x="136" y="312" width="70" height="70" rx="6"/><rect x="212" y="312" width="70" height="70" rx="6"/><rect x="288" y="312" width="70" height="70" rx="6"/>
    </g>

    <text x="410" y="275" font-size="72" fill="#8a919c" text-anchor="middle" dominant-baseline="central">+</text>

    <text x="619" y="140" font-size="26" font-weight="600" fill="#EE4C2C" text-anchor="middle">b · shape (4,)</text>
    <g fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2">
      <rect x="470" y="160" width="70" height="70" rx="6"/><rect x="546" y="160" width="70" height="70" rx="6"/><rect x="622" y="160" width="70" height="70" rx="6"/><rect x="698" y="160" width="70" height="70" rx="6"/>
    </g>
    <path d="M619 236 L619 300" stroke="#EE4C2C" stroke-width="2.5" fill="none" marker-end="url(#arrO)"/>
    <g fill="#FBEDE8" stroke="#EE4C2C" stroke-width="1.8" stroke-dasharray="6 5">
      <rect x="470" y="316" width="70" height="60" rx="6"/><rect x="546" y="316" width="70" height="60" rx="6"/><rect x="622" y="316" width="70" height="60" rx="6"/><rect x="698" y="316" width="70" height="60" rx="6"/>
    </g>
    <text x="619" y="410" font-size="20" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">复制扩展成 (3,4)</text>

    <text x="820" y="275" font-size="60" fill="#5a6270" text-anchor="middle" dominant-baseline="central">→</text>

    <text x="1029" y="140" font-size="26" font-weight="600" fill="#1f9d6b" text-anchor="middle">结果 · shape (3,4)</text>
    <g fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2">
      <rect x="880" y="160" width="70" height="70" rx="6"/><rect x="956" y="160" width="70" height="70" rx="6"/><rect x="1032" y="160" width="70" height="70" rx="6"/><rect x="1108" y="160" width="70" height="70" rx="6"/>
      <rect x="880" y="236" width="70" height="70" rx="6"/><rect x="956" y="236" width="70" height="70" rx="6"/><rect x="1032" y="236" width="70" height="70" rx="6"/><rect x="1108" y="236" width="70" height="70" rx="6"/>
      <rect x="880" y="312" width="70" height="70" rx="6"/><rect x="956" y="312" width="70" height="70" rx="6"/><rect x="1032" y="312" width="70" height="70" rx="6"/><rect x="1108" y="312" width="70" height="70" rx="6"/>
    </g>

    <line x1="60" y1="470" x2="1220" y2="470" stroke="#e2e6ec" stroke-width="1.5"/>
    <text x="640" y="530" font-size="26" fill="#333a45" text-anchor="middle" dominant-baseline="central">从尾部维度对齐：(4,) ↔ (3,4) 的最后一维</text>
    <text x="640" y="585" font-size="26" fill="#333a45" text-anchor="middle" dominant-baseline="central">缺失维度补 1，长度为 1 的维度被拉伸</text>
    <text x="640" y="640" font-size="26" fill="#333a45" text-anchor="middle" dominant-baseline="central">广播是零拷贝的逻辑扩展，不真正复制数据</text>
    <text x="640" y="690" font-size="22" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">某维度既不相等也不为 1 时报错（如 (3,4)+(2,4)）</text>
    <defs><marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker></defs>
</svg>
<ul class="points">
    <li><strong>规则</strong>：从尾部维度开始对齐 → 缺失维度补 1 → 长度为 1 的维度被拉伸。</li>
    <li>广播是<span class="tag t-green">零拷贝</span>的逻辑扩展，不真正复制数据，因此高效。</li>
    <li>某一维度既不相等、也不为 1 时<strong>报错</strong>（如 (3,4) + (2,4)）。</li>
  </ul>
</div>
</div>
</body>
</html>
