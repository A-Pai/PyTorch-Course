<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>形状变换与内存连续性：view 为什么有时失败</title>
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:6px;margin:0 3px;}
.t-blue{background:var(--blue-bg);color:var(--blue);}
.t-orange{background:var(--orange-bg);color:var(--orange);}
.t-green{background:var(--green-bg);color:var(--green);}
.t-red{background:var(--red-bg);color:var(--red);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>形状变换与内存连续性：view 为什么有时失败</h1>
<p class="src">对应教程：2.6 张量形状变换详解</p>
<div class="figure">
<svg viewBox="18.8 -0.7 1241.2 708.7" role="img" aria-label="内存连续性与 view reshape 示意图">
    <text x="640" y="52" font-size="30" font-weight="600" fill="#1a1d24" text-anchor="middle">形状变换与内存连续性：view 为什么有时失败</text>

    <text x="40" y="102" font-size="26" font-weight="600" fill="#2f6fb0">连续内存：view / reshape 都能改形状（共享内存）</text>
    <text x="40" y="142" font-size="20" fill="#5a6270">物理内存（连续）</text>
    <g fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2">
      <rect x="40" y="158" width="90" height="80" rx="7"/><rect x="138" y="158" width="90" height="80" rx="7"/><rect x="236" y="158" width="90" height="80" rx="7"/>
      <rect x="334" y="158" width="90" height="80" rx="7"/><rect x="432" y="158" width="90" height="80" rx="7"/><rect x="530" y="158" width="90" height="80" rx="7"/>
    </g>
    <g font-size="40" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">
      <text x="85" y="198">0</text><text x="183" y="198">1</text><text x="281" y="198">2</text>
      <text x="379" y="198">3</text><text x="477" y="198">4</text><text x="575" y="198">5</text>
    </g>
    <path d="M636 198 L742 198" stroke="#2f6fb0" stroke-width="2.5" fill="none" marker-end="url(#arrB)"/>
    <text x="689" y="178" font-size="20" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">view(2,3)</text>
    <g fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2">
      <rect x="758" y="158" width="90" height="80" rx="7"/><rect x="856" y="158" width="90" height="80" rx="7"/><rect x="954" y="158" width="90" height="80" rx="7"/>
      <rect x="758" y="246" width="90" height="80" rx="7"/><rect x="856" y="246" width="90" height="80" rx="7"/><rect x="954" y="246" width="90" height="80" rx="7"/>
    </g>
    <g font-size="38" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">
      <text x="803" y="198">0</text><text x="901" y="198">1</text><text x="999" y="198">2</text>
      <text x="803" y="286">3</text><text x="901" y="286">4</text><text x="999" y="286">5</text>
    </g>
    <text x="1130" y="230" font-size="24" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">零拷贝 ✓</text>

    <line x1="40" y1="360" x2="1240" y2="360" stroke="#e2e6ec" stroke-width="1.5"/>

    <text x="40" y="408" font-size="26" font-weight="600" fill="#EE4C2C">transpose 后不连续：物理内存没变，逻辑顺序变了</text>
    <text x="40" y="448" font-size="20" fill="#5a6270">t 是 (2,3) 张量；t.T 是 (3,2)</text>

    <text x="220" y="510" font-size="26" font-weight="600" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">✗ t.T.view(...) 报错</text>
    <text x="220" y="550" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">view 要求内存连续</text>
    <text x="220" y="610" font-size="26" font-weight="600" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">✓ reshape / contiguous() 可行</text>
    <path d="M360 585 L610 585" stroke="#1f9d6b" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
    <text x="485" y="563" font-size="20" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">必要时自动拷贝成连续</text>

    <text x="845" y="470" font-size="20" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">t.T (3,2) 的逻辑形状</text>
    <g fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2">
      <rect x="770" y="492" width="90" height="60" rx="7"/><rect x="868" y="492" width="90" height="60" rx="7"/>
      <rect x="770" y="560" width="90" height="60" rx="7"/><rect x="868" y="560" width="90" height="60" rx="7"/>
      <rect x="770" y="628" width="90" height="60" rx="7"/><rect x="868" y="628" width="90" height="60" rx="7"/>
    </g>
    <g font-size="36" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">
      <text x="815" y="522">0</text><text x="913" y="522">3</text>
      <text x="815" y="590">1</text><text x="913" y="590">4</text>
      <text x="815" y="658">2</text><text x="913" y="658">5</text>
    </g>
    <text x="1090" y="580" font-size="22" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">相邻元素在内存中跳跃</text>
    <text x="1090" y="618" font-size="22" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">→ 不连续</text>
    <defs>
      <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
      <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
    </defs>
</svg>
<ul class="points">
    <li><span class="tag t-blue">view</span> 零拷贝、共享内存，但<strong>要求内存连续</strong>；转置 / 索引后常不连续。</li>
    <li><span class="tag t-green">reshape</span> 更宽松：连续时共享内存，不连续时自动拷贝；<span class="tag t-orange">contiguous()</span> 显式拷贝成连续。</li>
    <li>形状变换的本质是<strong>对同一块内存的不同解释</strong>——理解内存布局才能判断共享 vs 拷贝。</li>
  </ul>
</div>
</div>
</body>
</html>
