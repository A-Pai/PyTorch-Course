<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多分支共享参数：梯度累加</title>
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;
--purple:#7b5cc4;--purple-bg:#F0EBFA;--amber:#b8860b;--amber-bg:#FBF3DE;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:6px;margin:0 3px;}
.t-blue{background:var(--blue-bg);color:var(--blue);}
.t-orange{background:var(--orange-bg);color:var(--orange);}
.t-green{background:var(--green-bg);color:var(--green);}
.t-red{background:var(--red-bg);color:var(--red);}
.t-purple{background:var(--purple-bg);color:var(--purple);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>多分支共享参数：梯度累加</h1>
<p class="src">对应教程：四、遍历机制 / 4.7 多分支共享参数</p>
<div class="figure">
<svg viewBox="18.8 -0.7 1081.2 717.7" role="img" aria-label="多分支共享参数：梯度累加">
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7b5cc4" stroke-width="1.8"/></marker>
</defs>
<text x="40" y="52" font-size="30" font-weight="600" fill="#1a1d24" text-anchor="start">多分支共享参数：梯度在 AccumulateGrad 处累加</text>
<text x="40" y="92" font-size="22" fill="#5a6270" text-anchor="start">同一个参数被多条路径“摸”到时，各路梯度求和而非覆盖</text>
<text x="40" y="145" font-size="23" font-weight="600" fill="#2f6fb0" text-anchor="start" dominant-baseline="central">计算结构：w 被两条分支共享</text>
<rect x="550.0" y="200" width="180" height="76" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="640" y="223.0" font-size="22" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">w（共享参数）</text>
<text x="640" y="253.0" font-size="16" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">requires_grad=True</text>
<rect x="280.0" y="330" width="200" height="76" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="380" y="353.0" font-size="23" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">y1 = w × 3</text>
<text x="380" y="383.0" font-size="18" fill="#39618c" text-anchor="middle" dominant-baseline="central">∂y1/∂w = 3</text>
<rect x="800.0" y="330" width="200" height="76" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="900" y="353.0" font-size="23" font-weight="600" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">y2 = w × 5</text>
<text x="900" y="383.0" font-size="18" fill="#39618c" text-anchor="middle" dominant-baseline="central">∂y2/∂w = 5</text>
<rect x="520.0" y="455" width="240" height="76" rx="14" fill="#F0EBFA" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="640" y="493.0" font-size="23" font-weight="600" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">loss = y1 + y2</text>
<path d="M600 275L440 330" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<path d="M680 275L940 330" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<path d="M450 405L560 455" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<path d="M830 405L720 455" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<text x="40" y="570" font-size="23" font-weight="600" fill="#7b5cc4" text-anchor="start" dominant-baseline="central">反向：两条路径梯度汇合到同一个 AccumulateGrad</text>
<rect x="120.0" y="605" width="420" height="92" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="330" y="632.0" font-size="26" font-weight="600" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">∂loss/∂w = 1×3 + 1×5 = 8</text>
<text x="330" y="670.0" font-size="18" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">两条路径在 AccumulateGrad 处累加 → w.grad = 8</text>
<rect x="800.0" y="605" width="280" height="92" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="940" y="632.0" font-size="24" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">不是覆盖！</text>
<text x="940" y="670.0" font-size="18" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">而是求和累加</text>
</svg>
<ul class="points">
    <li>同一参数被多条路径共享时，各路梯度在 <strong>AccumulateGrad</strong> 处<strong>累加</strong>，不是覆盖。</li>
    <li>例：loss = y1 + y2，y1=w×3、y2=w×5，则 <code>w.grad = 1×3 + 1×5 = 8</code>。</li>
    <li>这正是训练中“多次 backward 梯度累积”能生效的底层机制。</li>
</ul>
</div>
</div>
</body>
</html>
