<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;
--purple:#7b5cc4;--purple-bg:#F0EBFA;--amber:#b8860b;--amber-bg:#FBF3DE;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>nn.Module 全景地图</h1>
<p class="src">对应教程：一、torch.nn 核心基类 + 二、三大容器 —— 组件关系与训练闭环</p>
<div class="figure">
<svg viewBox="20.0 7.3 1230.0 684.7" role="img" aria-label="nn.Module 全景地图">
<defs>
<marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7b5cc4" stroke-width="1.8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b8860b" stroke-width="1.8"/></marker>
</defs>
<text x="40" y="46" font-size="28" font-weight="700" fill="#1a1d24" text-anchor="start" dominant-baseline="central">torch.nn 全景地图：组件关系与一次训练的数据流</text>
<text x="40" y="86" font-size="17" font-weight="400" fill="#5a6270" text-anchor="start" dominant-baseline="central">nn.Module 是共同基类——层、容器、模型、损失都由它派生；梯度由 autograd 反向算出，优化器据此更新参数</text>
<rect x="470" y="255" width="340" height="130" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.6"/>
<text x="640" y="290" font-size="24" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">nn.Module（共同基类）</text>
<text x="640" y="325" font-size="17" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">参数注册 · 设备迁移 · 状态保存</text>
<text x="640" y="353" font-size="17" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">模式切换 · 钩子 · 参数遍历</text>
<rect x="50" y="130" width="330" height="110" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="215" y="163" font-size="21" font-weight="700" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">网络层 Layer</text>
<text x="215" y="196" font-size="16" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">Linear / Conv / Norm / ReLU</text>
<text x="215" y="220" font-size="15" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">有参数层 + 无参数层</text>
<rect x="900" y="130" width="330" height="110" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="1065" y="163" font-size="21" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">容器 Container</text>
<text x="1065" y="196" font-size="16" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">Sequential / ModuleList</text>
<text x="1065" y="220" font-size="15" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">ModuleDict（组织层）</text>
<rect x="50" y="400" width="330" height="110" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="215" y="433" font-size="21" font-weight="700" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">损失函数 Loss</text>
<text x="215" y="466" font-size="16" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">MSELoss / CrossEntropyLoss</text>
<text x="215" y="490" font-size="15" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">BCEWithLogitsLoss</text>
<rect x="900" y="400" width="330" height="110" rx="14" fill="#FBF3DE" stroke="#b8860b" stroke-width="2.2"/>
<text x="1065" y="433" font-size="21" font-weight="700" fill="#8a6d1f" text-anchor="middle" dominant-baseline="central">模型 Model</text>
<text x="1065" y="466" font-size="16" font-weight="400" fill="#8a6d1f" text-anchor="middle" dominant-baseline="central">自定义 class(nn.Module)</text>
<text x="1065" y="490" font-size="15" font-weight="400" fill="#8a6d1f" text-anchor="middle" dominant-baseline="central">层 + 容器组合而成</text>
<path d="M380 200 C420 200 430 265 466 272" stroke="#EE4C2C" stroke-width="2.6" fill="none" marker-end="url(#arrO)"/>
<path d="M900 200 C860 200 850 265 814 272" stroke="#2f6fb0" stroke-width="2.6" fill="none" marker-end="url(#arrB)"/>
<path d="M380 440 C420 440 430 375 466 368" stroke="#1f9d6b" stroke-width="2.6" fill="none" marker-end="url(#arrG)"/>
<path d="M900 440 C860 440 850 375 814 368" stroke="#b8860b" stroke-width="2.6" fill="none" marker-end="url(#arrA)"/>
<text x="40" y="565" font-size="20" font-weight="700" fill="#1a1d24" text-anchor="start" dominant-baseline="central">一次训练的数据流（周而复始）</text>
<rect x="40" y="592" width="220" height="80" rx="14" fill="#FBF3DE" stroke="#b8860b" stroke-width="2.2"/>
<text x="150" y="620" font-size="18" font-weight="700" fill="#8a6d1f" text-anchor="middle" dominant-baseline="central">数据 utils.data</text>
<text x="150" y="650" font-size="15" font-weight="400" fill="#8a6d1f" text-anchor="middle" dominant-baseline="central">Dataset→batch</text>
<rect x="280" y="592" width="220" height="80" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="390" y="620" font-size="18" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">模型 nn.Module</text>
<text x="390" y="650" font-size="15" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">forward 前向</text>
<rect x="520" y="592" width="220" height="80" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="630" y="620" font-size="18" font-weight="700" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">损失 nn.*Loss</text>
<text x="630" y="650" font-size="15" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">算预测差异</text>
<rect x="760" y="592" width="220" height="80" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="870" y="620" font-size="18" font-weight="700" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">梯度 autograd</text>
<text x="870" y="650" font-size="15" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">backward 求导</text>
<rect x="1000" y="592" width="220" height="80" rx="14" fill="#F0EBFA" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="1110" y="620" font-size="18" font-weight="700" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">更新 torch.optim</text>
<text x="1110" y="650" font-size="15" font-weight="400" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">step() 改权重</text>
<path d="M264 632 L280 632" stroke="#EE4C2C" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
<path d="M504 632 L520 632" stroke="#EE4C2C" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
<path d="M744 632 L760 632" stroke="#EE4C2C" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
<path d="M984 632 L1000 632" stroke="#EE4C2C" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
</svg>
<ul class="points">
    <li><strong>nn.Module 是所有网络层、容器、模型、损失函数的共同父类</strong>，自定义网络必须继承它。</li>
    <li>参数注册、设备迁移、state_dict 持久化、train/eval 切换、钩子，全部由 nn.Module 统一提供。</li>
    <li>一次训练闭环：数据 → 模型前向 → 损失 → autograd 反向 → 优化器更新，周而复始。</li>
</ul>
</div>
</div>
</body>
</html>
