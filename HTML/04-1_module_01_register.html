<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;
--purple:#7b5cc4;--purple-bg:#F0EBFA;--amber:#b8860b;--amber-bg:#FBF3DE;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>自动注册：一次赋值背后发生了什么</h1>
<p class="src">对应教程：二、什么是「注册」 + 六、自动集中注册完整底层执行流程</p>
<div class="figure">
<svg viewBox="8.0 7.3 1252.0 633.2" role="img" aria-label="自动注册：一次赋值背后发生了什么">
<defs>
<marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7b5cc4" stroke-width="1.8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b8860b" stroke-width="1.8"/></marker>
</defs>
<text x="40" y="46" font-size="28" font-weight="700" fill="#1a1d24" text-anchor="start" dominant-baseline="central">自动注册：一次赋值背后发生了什么</text>
<text x="40" y="86" font-size="17" font-weight="400" fill="#5a6270" text-anchor="start" dominant-baseline="central">self.w = nn.Parameter(...) 触发 __setattr__ 拦截，识别专属标识后自动登记入台账</text>
<rect x="28" y="140" width="224" height="190" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="140" y="175" font-size="20" font-weight="700" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">赋值语句</text>
<text x="140" y="215" font-size="16" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">self.w =</text>
<text x="140" y="242" font-size="16" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">nn.Parameter</text>
<text x="140" y="269" font-size="15" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">(torch.randn(...))</text>
<rect x="274" y="140" width="224" height="190" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="386" y="175" font-size="20" font-weight="700" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">类型包装</text>
<text x="386" y="215" font-size="16" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">普通 Tensor →</text>
<text x="386" y="242" font-size="16" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">Parameter 子类</text>
<text x="386" y="269" font-size="15" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">加专属类标识</text>
<rect x="520" y="140" width="224" height="190" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="632" y="175" font-size="20" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">拦截赋值</text>
<text x="632" y="215" font-size="16" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">触发 nn.Module</text>
<text x="632" y="242" font-size="16" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">重写的</text>
<text x="632" y="269" font-size="15" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">__setattr__</text>
<rect x="766" y="140" width="224" height="190" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="878" y="175" font-size="20" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">识别标识</text>
<text x="878" y="215" font-size="16" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">isinstance(</text>
<text x="878" y="242" font-size="16" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">value, Parameter</text>
<text x="878" y="269" font-size="15" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">) 判定</text>
<rect x="1012" y="140" width="224" height="190" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="1124" y="175" font-size="20" font-weight="700" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">登记入账</text>
<text x="1124" y="215" font-size="16" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">写入 self.</text>
<text x="1124" y="242" font-size="16" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">_parameters</text>
<text x="1124" y="269" font-size="15" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">自动注册完成</text>
<path d="M252 235 L272 235" stroke="#EE4C2C" stroke-width="2.4" fill="none" marker-end="url(#arrO)"/>
<path d="M498 235 L518 235" stroke="#EE4C2C" stroke-width="2.4" fill="none" marker-end="url(#arrO)"/>
<path d="M744 235 L764 235" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<path d="M990 235 L1010 235" stroke="#2f6fb0" stroke-width="2.4" fill="none" marker-end="url(#arrB)"/>
<rect x="40" y="380" width="560" height="200" rx="14" fill="#FBEaea" stroke="#d23f3f" stroke-width="2.2"/>
<text x="320" y="412" font-size="20" font-weight="700" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">普通 torch.Tensor（无专属标识）</text>
<text x="320" y="452" font-size="16" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">self.t = torch.randn(...)</text>
<text x="320" y="482" font-size="16" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">__setattr__ 不认定为参数 → 不登记</text>
<text x="320" y="512" font-size="16" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">优化器 parameters() 找不到，不会被更新</text>
<text x="320" y="545" font-size="15" font-weight="400" fill="#5a6270" text-anchor="middle" dominant-baseline="central">Tensor 仅能算梯度，不进入统一管理</text>
<rect x="640" y="380" width="600" height="200" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="940" y="412" font-size="20" font-weight="700" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">nn.Parameter（带 Parameter 专属标识）</text>
<text x="940" y="452" font-size="16" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">self.w = nn.Parameter(...)</text>
<text x="940" y="482" font-size="16" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">__setattr__ 识别标识 → 写入 _parameters</text>
<text x="940" y="512" font-size="16" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">优化器 parameters() 能找到，会被更新</text>
<text x="940" y="545" font-size="15" font-weight="400" fill="#5a6270" text-anchor="middle" dominant-baseline="central">设备迁移 / 保存 / 模式切换全自动</text>
<text x="40" y="610" font-size="16" font-weight="400" fill="#5a6270" text-anchor="start" dominant-baseline="central">生活类比：Parameter 是「住户身份牌」，__setattr__ 是「物业门卫」，_parameters 是「统一住户名册」——无需用户手动填表。</text>
</svg>
<ul class="points">
    <li><strong>nn.Parameter 做两件事</strong>：把普通 Tensor 包装成带专属类标识的子类，并默认 requires_grad=True。</li>
    <li>自动注册 = __setattr__ 识别 Parameter 标识 + 自动写入 _parameters 台账，用户全程无感知。</li>
    <li>普通 Tensor 即使 requires_grad=True，因无专属标识也不会被登记，框架批量操作时会被忽略。</li>
</ul>
</div>
</div>
</body>
</html>
