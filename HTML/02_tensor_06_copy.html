<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三种"复制"方式：数据共享与梯度路径</title>
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:6px;margin:0 3px;}
.t-blue{background:var(--blue-bg);color:var(--blue);}
.t-orange{background:var(--orange-bg);color:var(--orange);}
.t-green{background:var(--green-bg);color:var(--green);}
.t-red{background:var(--red-bg);color:var(--red);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>三种"复制"方式：数据共享与梯度路径</h1>
<p class="src">对应教程：附录二 三种复制方式对比 / 附录三 .data vs .detach()</p>
<div class="figure">
<svg viewBox="10.0 -0.8 1260.0 700.8" role="img" aria-label="三种复制方式对比">
    <text x="640" y="52" font-size="30" font-weight="600" fill="#1a1d24" text-anchor="middle">三种"复制"方式：数据共享与梯度路径</text>

    <rect x="30" y="90" width="380" height="590" rx="14" fill="#f7fbf9" stroke="#1f9d6b" stroke-width="2.5"/>
    <text x="220" y="140" font-size="32" font-weight="600" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">clone()</text>
    <text x="220" y="182" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">透传节点 · 最安全</text>
    <rect x="65" y="235" width="120" height="90" rx="8" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2"/>
    <text x="125" y="280" font-size="22" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">原数据 y</text>
    <path d="M185 280 L255 280" stroke="#1f9d6b" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
    <text x="220" y="258" font-size="18" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">拷贝</text>
    <rect x="255" y="235" width="120" height="90" rx="8" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2"/>
    <text x="315" y="280" font-size="22" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">独立副本</text>
    <path d="M315 340 L315 405 L125 405 L125 340" stroke="#1f9d6b" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrG)"/>
    <text x="220" y="442" font-size="22" fill="#1f9d6b" text-anchor="middle" dominant-baseline="central">梯度可回传原对象 ✓</text>
    <text x="220" y="525" font-size="21" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">数据独立 ✓　grad_fn 保留 ✓</text>
    <text x="220" y="590" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">共享内存 ✗</text>
    <text x="220" y="635" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">改副本不动原图</text>

    <rect x="450" y="90" width="380" height="590" rx="14" fill="#fbf9f4" stroke="#BA7517" stroke-width="2.5"/>
    <text x="640" y="140" font-size="32" font-weight="600" fill="#BA7517" text-anchor="middle" dominant-baseline="central">detach()</text>
    <text x="640" y="182" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">共享数据 · 切断梯度</text>
    <rect x="485" y="235" width="120" height="90" rx="8" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2"/>
    <text x="545" y="280" font-size="22" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">原数据 y</text>
    <path d="M605 280 L675 280" stroke="#BA7517" stroke-width="2.5" fill="none" marker-end="url(#arrA)"/>
    <text x="640" y="258" font-size="18" fill="#BA7517" text-anchor="middle" dominant-baseline="central">视图</text>
    <rect x="675" y="235" width="120" height="90" rx="8" fill="#FAC775" fill-opacity="0.4" stroke="#BA7517" stroke-width="2"/>
    <text x="735" y="280" font-size="22" fill="#8a5a0b" text-anchor="middle" dominant-baseline="central">共享数据</text>
    <path d="M735 340 L735 405" stroke="#d23f3f" stroke-width="2.5" fill="none"/>
    <line x1="720" y1="360" x2="750" y2="390" stroke="#d23f3f" stroke-width="3"/>
    <line x1="750" y1="360" x2="720" y2="390" stroke="#d23f3f" stroke-width="3"/>
    <text x="640" y="442" font-size="22" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">梯度被切断 ✗</text>
    <text x="640" y="525" font-size="21" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">数据独立 ✗　grad_fn 无</text>
    <text x="640" y="590" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">共享内存 ✓</text>
    <text x="640" y="635" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">in-place 改动影响原值</text>

    <rect x="870" y="90" width="380" height="590" rx="14" fill="#fbf7f6" stroke="#EE4C2C" stroke-width="2.5"/>
    <text x="1060" y="140" font-size="32" font-weight="600" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">torch.tensor(y)</text>
    <text x="1060" y="182" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">新建叶子 · 完全断开</text>
    <rect x="905" y="235" width="120" height="90" rx="8" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2"/>
    <text x="965" y="280" font-size="22" fill="#2f6fb0" text-anchor="middle" dominant-baseline="central">原数据 y</text>
    <path d="M1025 280 L1095 280" stroke="#EE4C2C" stroke-width="2.5" fill="none" marker-end="url(#arrO)"/>
    <text x="1060" y="258" font-size="18" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">构造</text>
    <rect x="1095" y="235" width="120" height="90" rx="8" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2"/>
    <text x="1155" y="280" font-size="22" fill="#EE4C2C" text-anchor="middle" dominant-baseline="central">新叶子</text>
    <text x="1060" y="442" font-size="22" fill="#d23f3f" text-anchor="middle" dominant-baseline="central">grad_fn=None，梯度到此为止 ✗</text>
    <text x="1060" y="525" font-size="21" fill="#2c2c2a" text-anchor="middle" dominant-baseline="central">数据独立 ✓　新叶子 ✓</text>
    <text x="1060" y="590" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">共享内存 ✗</text>
    <text x="1060" y="635" font-size="20" fill="#5a6270" text-anchor="middle" dominant-baseline="central">固定教师输出</text>
    <defs>
      <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
      <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.8"/></marker>
      <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
    </defs>
</svg>
<ul class="points">
    <li><span class="tag t-green">clone</span>：数据独立 + 保留梯度路径，梯度能流回原对象。</li>
    <li><span class="tag t-orange">detach</span>：共享数据 + 切断梯度，改视图会影响原值，但不进计算图。</li>
    <li><span class="tag t-red">torch.tensor(y)</span>：数据独立 + 新建叶子，梯度完全断开。</li>
  </ul>
</div>
</div>
</body>
</html>
