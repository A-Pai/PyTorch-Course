<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--ink:#1a1d24;--sub:#5a6270;--line:#e2e6ec;--bg:#f5f6f8;--card:#fff;
--orange:#EE4C2C;--orange-bg:#FCEDE8;--blue:#2f6fb0;--blue-bg:#E8F1FA;
--green:#1f9d6b;--green-bg:#E6F5EE;--red:#d23f3f;--red-bg:#FBEaea;
--purple:#7b5cc4;--purple-bg:#F0EBFA;--amber:#b8860b;--amber-bg:#FBF3DE;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.5;overflow:auto;}
.wrap{height:100vh;max-width:1320px;margin:0 auto;padding:10px 24px 10px;
 display:flex;flex-direction:column;}
h1{flex:none;margin:0 0 2px;font-size:20px;line-height:1.4;padding-left:14px;border-left:5px solid var(--orange);}
.src{flex:none;color:var(--sub);font-size:13px;line-height:1.5;margin:0 0 8px;}
.figure{flex:1;min-height:0;display:flex;flex-direction:column;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:10px 18px 10px;}
svg{flex:1 1 0;min-height:0;display:block;width:100%;height:0;max-width:100%;
 margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
.points{flex:none;margin:8px 0 0;padding:0;list-style:none;}
.points li{position:relative;padding:2px 0 2px 24px;font-size:13px;line-height:1.45;color:#333a45;}
.points li:before{content:"";position:absolute;left:4px;top:9px;width:8px;height:8px;
 border-radius:50%;background:var(--orange);}
text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
</style>
</head>
<body>
<div class="wrap">
<h1>端到端训练闭环与 Hook</h1>
<p class="src">对应教程：2 模型定义 + 4 Hook 机制 + 5 训练循环 + 7 模型导出</p>
<div class="figure">
<svg viewBox="18.8 7.3 1241.2 628.2" role="img" aria-label="端到端训练闭环与 Hook">
<defs>
<marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EE4C2C" stroke-width="1.8"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2f6fb0" stroke-width="1.8"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1f9d6b" stroke-width="1.8"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7b5cc4" stroke-width="1.8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b8860b" stroke-width="1.8"/></marker>
</defs>
<text x="40" y="46" font-size="28" font-weight="700" fill="#1a1d24" text-anchor="start" dominant-baseline="central">端到端训练闭环与 Hook 挂载点</text>
<text x="40" y="86" font-size="17" font-weight="400" fill="#5a6270" text-anchor="start" dominant-baseline="central">把前面所有组件串成一次完整训练；Hook 让你在不改模型代码的情况下取出中间信息</text>
<rect x="40" y="150" width="220" height="110" rx="14" fill="#FBF3DE" stroke="#b8860b" stroke-width="2.2"/>
<text x="150" y="182" font-size="20" font-weight="700" fill="#8a6d1f" text-anchor="middle" dominant-baseline="central">数据</text>
<text x="150" y="215" font-size="14" font-weight="400" fill="#8a6d1f" text-anchor="middle" dominant-baseline="central">utils.data</text>
<text x="150" y="239" font-size="14" font-weight="400" fill="#8a6d1f" text-anchor="middle" dominant-baseline="central">Dataset→batch</text>
<rect x="270" y="150" width="220" height="110" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.2"/>
<text x="380" y="182" font-size="20" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">模型</text>
<text x="380" y="215" font-size="14" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">nn.Module</text>
<text x="380" y="239" font-size="14" font-weight="400" fill="#39618c" text-anchor="middle" dominant-baseline="central">ResNet 风格</text>
<rect x="500" y="150" width="220" height="110" rx="14" fill="#E6F5EE" stroke="#1f9d6b" stroke-width="2.2"/>
<text x="610" y="182" font-size="20" font-weight="700" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">损失</text>
<text x="610" y="215" font-size="14" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">nn.*Loss</text>
<text x="610" y="239" font-size="14" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">算预测差异</text>
<rect x="730" y="150" width="220" height="110" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.2"/>
<text x="840" y="182" font-size="20" font-weight="700" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">反向</text>
<text x="840" y="215" font-size="14" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">loss.backward</text>
<text x="840" y="239" font-size="14" font-weight="400" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">autograd 求导</text>
<rect x="960" y="150" width="220" height="110" rx="14" fill="#F0EBFA" stroke="#7b5cc4" stroke-width="2.2"/>
<text x="1070" y="182" font-size="20" font-weight="700" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">更新</text>
<text x="1070" y="215" font-size="14" font-weight="400" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">optim.step</text>
<text x="1070" y="239" font-size="14" font-weight="400" fill="#7b5cc4" text-anchor="middle" dominant-baseline="central">改权重</text>
<path d="M262 205 L270 205" stroke="#EE4C2C" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
<path d="M492 205 L500 205" stroke="#EE4C2C" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
<path d="M722 205 L730 205" stroke="#EE4C2C" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
<path d="M952 205 L960 205" stroke="#EE4C2C" stroke-width="2.2" fill="none" marker-end="url(#arrO)"/>
<path d="M1070 260 L1070 306 L150 306 L150 296" stroke="#9aa1ad" stroke-width="2.0" fill="none"/>
<path d="M150 296 L150 264" stroke="#b8860b" stroke-width="2.2" fill="none" marker-end="url(#arrA)"/>
<text x="610" y="318" font-size="15" font-weight="400" fill="#5a6270" text-anchor="middle" dominant-baseline="central">循环：下一个 batch 重复上述过程，直到训练结束</text>
<rect x="40" y="350" width="1200" height="220" rx="14" fill="#fafbfc" stroke="#d7dce4" stroke-width="1.8"/>
<text x="640" y="382" font-size="19" font-weight="700" fill="#1a1d24" text-anchor="middle" dominant-baseline="central">Hook 机制：不改 forward，就能「挂载」到模块上取信息</text>
<rect x="70" y="410" width="540" height="135" rx="14" fill="#E8F1FA" stroke="#2f6fb0" stroke-width="2.0"/>
<text x="340" y="442" font-size="18" font-weight="700" fill="#39618c" text-anchor="middle" dominant-baseline="central">register_forward_hook</text>
<text x="340" y="478" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">前向传播后自动触发</text>
<text x="340" y="508" font-size="14" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">拿到该层的输出（特征图），做可视化 / 特征提取</text>
<rect x="670" y="410" width="540" height="135" rx="14" fill="#FCEDE8" stroke="#EE4C2C" stroke-width="2.0"/>
<text x="940" y="442" font-size="18" font-weight="700" fill="#8a4a38" text-anchor="middle" dominant-baseline="central">register_backward_hook</text>
<text x="940" y="478" font-size="15" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">反向传播时自动触发</text>
<text x="940" y="508" font-size="14" font-weight="400" fill="#333" text-anchor="middle" dominant-baseline="central">拿到梯度，做梯度可视化 / 诊断</text>
<text x="40" y="605" font-size="16" font-weight="400" fill="#5a6270" text-anchor="start" dominant-baseline="central">收尾：训练完成后用 TorchScript / torch.export 导出模型，进入部署环节（见第 07 章）。</text>
</svg>
<ul class="points">
    <li>训练闭环：数据 → 模型前向 → 损失 → backward → optim.step，逐 batch 循环。</li>
    <li><strong>register_forward_hook</strong> 取前向输出（特征图），<strong>register_backward_hook</strong> 取梯度，均无需改动 forward。</li>
    <li>训练完成后导出模型（TorchScript / torch.export），衔接部署章节。</li>
</ul>
</div>
</div>
</body>
</html>
